
name: Churn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt pytest httpx

      - name: API testlerini çalıştır
        run: python -m pytest -v tests/test_api.py

      - name: API Docker image oluştur
        run: docker build -t churn-api -f Dockerfile .

      - name: Streamlit Docker image oluştur
        run: docker build -t churn-streamlit -f Dockerfile.streamlit .

